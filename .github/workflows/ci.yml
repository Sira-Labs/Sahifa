name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: python core
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Known vulnerabilities fail the job unless accepted in security/audit-ignore.toml (spec 012).
      - name: pip-audit
        run: |
          uv run --with pip-audit pip-audit -f json --skip-editable > "$RUNNER_TEMP/audit.json" || true
          python3 ../.github/scripts/security_policy.py --ignores ../security/audit-ignore.toml audit pip < "$RUNNER_TEMP/audit.json"
      # End to end on DuckDB: a synthetic shop with injected faults must produce findings.
      - name: smoke scan of a synthetic shop
        run: |
          uv run sahifa synth /tmp/shop && uv run sahifa scan /tmp/shop --json | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['findings'], 'expected findings'; print(r['score']['overall'])"

  api:
    name: python api
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    # One throwaway Postgres serves as the metadata database and as a source to scan.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sahifa
          POSTGRES_PASSWORD: sahifa
          POSTGRES_DB: sahifa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sahifa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SAHIFA_DATABASE_URL: postgresql+psycopg://sahifa:sahifa@localhost:5432/sahifa
      SAHIFA_TEST_DATABASE_URL: postgresql+psycopg://sahifa:sahifa@localhost:5432/sahifa
      SAHIFA_TEST_SOURCE_URL: postgresql://sahifa:sahifa@localhost:5432/sahifa
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Models and migrations must agree; the tests leave the schema at head.
      - run: uv run alembic upgrade head && uv run alembic check
      # Known vulnerabilities fail the job unless accepted in security/audit-ignore.toml (spec 012).
      - name: pip-audit
        run: |
          uv run --with pip-audit pip-audit -f json --skip-editable > "$RUNNER_TEMP/audit.json" || true
          python3 ../.github/scripts/security_policy.py --ignores ../security/audit-ignore.toml audit pip < "$RUNNER_TEMP/audit.json"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # High and critical advisories in production dependencies fail the job (spec 012).
      - name: pnpm audit
        run: |
          pnpm audit --prod --json > "$RUNNER_TEMP/audit.json" || true
          python3 ../.github/scripts/security_policy.py --ignores ../security/audit-ignore.toml audit pnpm < "$RUNNER_TEMP/audit.json"
      # The web image's edge config must parse (headers, proxies, cache rules).
      - name: caddy validate
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Something that looks like a credential anywhere in the history fails the build (spec 019).
  # Values that are not secrets are listed by fingerprint in .gitleaksignore.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A committed token must be found and a clean commit must pass, or the scan proves nothing.
      - name: self-test
        run: .github/scripts/secret-scan-selftest.sh "$RUNNER_TEMP/gitleaks"
      - name: scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  # The web image runs Caddy as uid 10001 and still serves on 80 and 443 (spec 019).
  web-image:
    name: web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -f web/Dockerfile --build-arg SAHIFA_COMMIT="$GITHUB_SHA" -t sahifa-web:ci .
      - name: non-root and serving
        run: .github/scripts/web-image-check.sh sahifa-web:ci "$GITHUB_SHA"

  # Runtime dependencies of core, api and web against ADR-0008 and ADR-0015 (spec 012).
  licences:
    name: licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      # Runtime only: no dev extras, so test and lint tools are not counted.
      - name: core
        working-directory: core
        run: |
          uv sync --locked
          uv run --no-sync python ../.github/scripts/security_policy.py --policy ../security/licences.toml licences python
      - name: api
        working-directory: api
        run: |
          uv sync --locked
          uv run --no-sync python ../.github/scripts/security_policy.py --policy ../security/licences.toml licences python
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --prod
          pnpm licenses list --prod --json | python3 ../.github/scripts/security_policy.py --policy ../security/licences.toml licences pnpm
