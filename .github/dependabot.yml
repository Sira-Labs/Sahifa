# Weekly dependency updates, grouped so minor/patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directory: /core
    schedule: { interval: weekly, day: monday }
    groups:
      core-python-minor: { update-types: [minor, patch] }
    labels: ["area: core", "dependencies"]
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      api-python-minor: { update-types: [minor, patch] }
    labels: ["area: api", "dependencies"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor: { update-types: [minor, patch] }
    labels: ["area: web", "dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["area: ci", "dependencies"]
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule: { interval: weekly, day: monday }
    labels: ["area: deploy", "dependencies"]
    # Node majors are taken by hand on the LTS cadence (25+ dropped Corepack).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
