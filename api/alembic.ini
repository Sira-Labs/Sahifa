# Developer entry point for the Alembic CLI (`uv run alembic upgrade head`, `alembic check`).
# The migrations are packaged in sahifa/db/migrations; the image runs
# `python -m sahifa.db.migrate upgrade head` instead. The URL comes from SAHIFA_* settings.
[alembic]
script_location = src/sahifa/db/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
