[project]
name = "sahifa-core"
version = "0.1.0"
description = "Sahifa core: profiling, checks and scoring with intervals for whole data stores"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sira Labs" }]
dependencies = [
    "duckdb>=1.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
sahifa = "sahifa_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sahifa_core"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "T20", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]
# S608: SQL is built through sql.py, which quotes identifiers and literals.
# RUF001-3: en dashes and typographic characters in user-facing text are intended.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"src/sahifa_core/cli.py" = ["T20"]
"src/sahifa_core/synth.py" = ["S311"]  # demo data, not security

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sahifa_core"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
